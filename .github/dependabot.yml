# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # Maintain dependencies for npm (Next.js project)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # react and react-dom must stay on matching versions -- the renderer
    # depends on it -- but Dependabot does not pair them by default the way
    # it auto-pairs a package with its own @types/* package. Group them (and
    # their types) explicitly so they always bump together in one PR.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
