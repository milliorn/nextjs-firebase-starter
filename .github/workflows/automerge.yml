name: Dependabot reviewer

# Fires whenever Dependabot opens, updates, or reopens a PR targeting main.
# pull_request_target runs in the context of the base branch, which gives
# enough permission to approve and merge. The merge itself is authenticated
# with DEPENDABOT_REBASE_PAT, not GITHUB_TOKEN (see the env block below for
# why), so do not remove that secret.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: ["main"]

# One run per PR at a time. We let the current run finish so an in-progress
# squash merge isn't interrupted mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# Minimum permissions needed:
# - pull-requests: approve and comment on PRs
# - contents: enable auto-merge (writes to the merge queue)
permissions:
  pull-requests: write
  contents: write

jobs:
  review-dependabot-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Skip entirely if this PR wasn't opened by Dependabot.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      # PAT, not GITHUB_TOKEN: a GITHUB_TOKEN-authored merge can't trigger
      # other workflow runs (GitHub's anti-recursion protection), so it would
      # silently never fire dependabot-rebase-cascade.yml's trigger, and
      # stale sibling PRs would never get rebased. A PAT-authenticated merge
      # is a normal event and triggers it correctly. Needs Contents:
      # read/write in addition to Pull requests: read/write, or --auto fails
      # with "Resource not accessible by personal access token
      # (enablePullRequestAutoMerge)".
      GH_TOKEN: ${{ secrets.DEPENDABOT_REBASE_PAT }}

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0

      # Decide once: allow github-actions (any semver) or patch/minor updates;
      # deny everything else. Major updates are filtered upstream by dependabot.yml,
      # so deny is a safety net for anything unexpected that slips through.
      - name: Decide
        id: decision
        run: |
          ecosystem="${{ steps.metadata.outputs.package-ecosystem }}"
          update_type="${{ steps.metadata.outputs.update-type }}"
          if [[ "$ecosystem" == "github_actions" ]] || \
             [[ "$update_type" == "version-update:semver-patch" ]] || \
             [[ "$update_type" == "version-update:semver-minor" ]]; then
            echo "action=allow" >> "$GITHUB_OUTPUT"
          else
            echo "action=deny" >> "$GITHUB_OUTPUT"
          fi

      # --auto queues the merge so all required branch protection checks must
      # pass first (e.g. dependency-review) before the merge goes through.
      - name: Allow — approve and merge
        if: steps.decision.outputs.action == 'allow'
        run: |
          gh pr review "$PR_URL" --approve -b "Auto-approved: **${{ steps.metadata.outputs.update-type }}** ${{ steps.metadata.outputs.package-ecosystem }} update."
          gh pr merge "$PR_URL" --squash --auto

      - name: Deny — unexpected update
        if: steps.decision.outputs.action == 'deny'
        run: |
          gh pr close "$PR_URL" --comment "Auto-closed: ecosystem \`${{ steps.metadata.outputs.package-ecosystem }}\` / update-type \`${{ steps.metadata.outputs.update-type }}\` did not match any allow-list rule. Check dependabot.yml if this is unexpected."
