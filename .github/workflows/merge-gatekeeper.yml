---
name: Merge Gatekeeper

on:
  pull_request:
    branches:
      - main

jobs:
  merge-gatekeeper:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      checks: read
      statuses: read
    steps:
      - name: Run Merge Gatekeeper
        uses: upsidr/merge-gatekeeper@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Action's own default poll timeout is 600s, far past this job's
          # 2min limit. Without this, a slow sibling check gets killed by the
          # job's hard timeout instead of the action's own graceful one.
          timeout: 100
